{% extends "base.html" %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="card shadow-sm border-0" style="width: 450px; max-width: 100%;">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <img src="{{ url_for('static', filename='images/Logo Jaya Teknik.png') }}" alt="PT Jaya Teknik Indonesia" style="max-height: 70px;">
                <h4 class="mt-3 text-dark fw-bold">Register</h4>
                <p class="text-muted small">Create an account for PT Jaya Teknik Indonesia</p>
            </div>
            
            <form method="POST" action="{{ url_for('auth.register') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div class="mb-3">
                    <label for="name" class="form-label text-muted small fw-bold">Nama Lengkap</label>
                    <input type="text" class="form-control bg-light" id="name" name="name" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="nrp" class="form-label text-muted small fw-bold">NRP</label>
                    <input type="text" class="form-control bg-light" id="nrp" name="nrp" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label text-muted small fw-bold">Password</label>
                    <input type="password" class="form-control bg-light" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Register</button>
            </form>
            <div class="text-center mt-3">
                <a href="{{ url_for('auth.login') }}" class="text-decoration-none small">Already have an account? Log In</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
