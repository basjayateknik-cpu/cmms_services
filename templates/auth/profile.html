{% extends "base.html" %}

{% block content %}
<style>
/* ID Card Profile Styling */
.settings-pane-card { background: #ffffff; border-radius: 1.25rem; box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.08); border: none; overflow: hidden; }
.id-card-header { background: linear-gradient(135deg, #4f46e5, #3b82f6); height: 140px; position: relative; }
.id-card-avatar { width: 100px; height: 100px; background: white; border-radius: 50%; border: 4px solid white; box-shadow: 0 4px 15px rgba(0,0,0,0.1); position: absolute; bottom: -50px; left: 40px; display: flex; align-items: center; justify-content: center; font-size: 3rem; color: #4f46e5; }
.id-card-body { padding: 60px 40px 40px; }

.form-control { border-radius: 10px; border: 1px solid #e2e8f0; padding: 0.75rem 1.25rem; background-color: #f8fafc; transition: all 0.2s ease; }
.form-control:focus { border-color: #4f46e5; background-color: #ffffff; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
</style>

<div class="row justify-content-center mt-3">
    <div class="col-lg-8">
        <div class="settings-pane-card">
            <!-- Digital ID Header -->
            <div class="id-card-header">
                <div class="position-absolute top-0 end-0 p-3 text-white opacity-50">
                    <i class="bi bi-shield-check fs-4"></i>
                </div>
                <div class="id-card-avatar">
                    <i class="bi bi-person-fill"></i>
                </div>
            </div>
            
            <div class="id-card-body">
                <div class="d-flex justify-content-between align-items-start mb-4 pb-3 border-bottom">
                    <div>
                        <h3 class="fw-bold mb-1" style="letter-spacing: -0.5px; color: #1e293b;">{{ current_user.name }}</h3>
                        <p class="text-muted mb-0 d-flex align-items-center">
                            <span class="badge bg-primary bg-opacity-10 text-primary border border-primary border-opacity-25 rounded-pill px-3 me-2">{{ current_user.role }}</span>
                            <i class="bi bi-fingerprint me-1"></i> ID: {{ current_user.nrp }}
                        </p>
                    </div>
                    <a href="{{ url_for('auth.logout') }}" class="btn btn-light text-danger fw-bold shadow-sm rounded-pill px-4">
                        <i class="bi bi-box-arrow-right me-1"></i> Log Out
                    </a>
                </div>
                
                <form action="{{ url_for('auth.profile') }}" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    
                    <div class="row g-4 mb-4">
                        <div class="col-md-6">
                            <label for="name" class="form-label text-muted small fw-bold text-uppercase" style="letter-spacing: 0.05em;">Display Name</label>
                            <input type="text" class="form-control fw-medium text-dark" id="name" name="name" value="{{ current_user.name }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="nrp" class="form-label text-muted small fw-bold text-uppercase" style="letter-spacing: 0.05em;">Employee ID (NRP)</label>
                            <input type="text" class="form-control text-muted" id="nrp" value="{{ current_user.nrp }}" disabled>
                            <div class="form-text small opacity-75">Contact system administrator to modify.</div>
                        </div>
                    </div>
                    
                    <div class="bg-light rounded-4 p-4 mb-4 border" style="border-color: #f1f5f9 !important;">
                        <h6 class="fw-bold mb-3 d-flex align-items-center" style="color: #1e293b;">
                            <i class="bi bi-key-fill text-warning me-2 fs-5"></i> Security Settings
                        </h6>
                        
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="new_password" class="form-label text-muted small fw-bold">New Password</label>
                                <input type="password" class="form-control" id="new_password" name="new_password" placeholder="Leave blank to keep current">
                            </div>
                            <div class="col-md-6">
                                <label for="confirm_password" class="form-label text-muted small fw-bold">Confirm Password</label>
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Re-type new password">
                            </div>
                        </div>
                    </div>
                    
                    <div class="d-flex justify-content-end">
                        <button type="submit" class="btn btn-primary rounded-pill fw-bold px-5 py-2 shadow-sm">
                            <i class="bi bi-check2-circle me-1"></i> Save Configuration
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
