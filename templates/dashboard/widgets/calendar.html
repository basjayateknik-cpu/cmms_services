<!-- Maintenance Calendar Widget -->
<div class="card shadow-sm border-0 h-100">
    <div class="card-header bg-white pt-3 pb-2 border-bottom-0 d-flex justify-content-between align-items-center flex-wrap">
        <h6 class="mb-0 fw-bold"><i class="bi bi-calendar-event text-info me-2"></i> Maintenance Schedule</h6>
    </div>
    <div class="card-body p-3">
        <div id="calendar" style="min-height: 400px;"></div>
        <div class="mt-3 d-flex flex-wrap gap-3 small text-muted justify-content-center">
            <span class="d-inline-flex align-items-center"><span style="width: 10px; height: 10px; background-color: #64748b; border-radius: 50%; display: inline-block; margin-right: 5px;"></span> Draft</span>
            <span class="d-inline-flex align-items-center"><span style="width: 10px; height: 10px; background-color: #0ea5e9; border-radius: 50%; display: inline-block; margin-right: 5px;"></span> Assigned</span>
            <span class="d-inline-flex align-items-center"><span style="width: 10px; height: 10px; background-color: #3b82f6; border-radius: 50%; display: inline-block; margin-right: 5px;"></span> In Progress</span>
            <span class="d-inline-flex align-items-center"><span style="width: 10px; height: 10px; background-color: #f59e0b; border-radius: 50%; display: inline-block; margin-right: 5px;"></span> Hold</span>
            <span class="d-inline-flex align-items-center"><span style="width: 10px; height: 10px; background-color: #8b5cf6; border-radius: 50%; display: inline-block; margin-right: 5px;"></span> Solved</span>
            <span class="d-inline-flex align-items-center"><span style="width: 10px; height: 10px; background-color: #10b981; border-radius: 50%; display: inline-block; margin-right: 5px;"></span> Completed</span>
            <span class="d-inline-flex align-items-center"><span style="width: 10px; height: 10px; background-color: #be123c; border-radius: 50%; display: inline-block; margin-right: 5px;"></span> Incompleted</span>
            <span class="d-inline-flex align-items-center"><span style="width: 10px; height: 10px; background-color: #e74a3b; border-radius: 50%; display: inline-block; margin-right: 5px;"></span> Overdue</span>
        </div>
    </div>
</div>
