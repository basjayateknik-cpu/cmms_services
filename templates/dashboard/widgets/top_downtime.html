<!-- Top 5 Downtime Assets Widget -->
<div class="card h-100">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h6 class="mb-0 fw-bold text-dark"><i class="bi bi-shield-exclamation text-danger me-2"></i> Top 5 Downtime Assets</h6>
        <a href="{{ url_for('assets.index') }}" class="small text-decoration-none">View All Assets</a>
    </div>
    <div class="card-body p-0">
        <ul class="list-group list-group-flush">
            {% for asset in top_downtime_assets %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <div>
                    <a href="{{ url_for('assets.view', id=asset.id) }}" class="fw-bold d-block text-decoration-none text-dark">{{ asset.name }}</a>
                    <small class="text-muted"><i class="bi bi-upc-scan me-1"></i>{{ asset.code }}</small>
                </div>
                <span class="badge soft-badge-danger rounded-pill px-3 py-2"><i class="bi bi-clock-history me-1"></i> {{ asset.hours }} hrs down</span>
            </li>
            {% else %}
            <li class="list-group-item text-center py-5 text-muted d-flex flex-column align-items-center">
                <i class="bi bi-shield-check fs-2 text-success mb-2"></i>
                No downtime records available.
            </li>
            {% endfor %}
        </ul>
    </div>
</div>
