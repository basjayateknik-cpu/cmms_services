{% extends "base.html" %}

{% block content %}
<div class="d-flex flex-column" style="height: calc(100vh - 120px);">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="d-flex align-items-center">
            <a href="{{ url_for('bas_monitoring.index') }}" class="btn btn-sm btn-outline-secondary me-3 rounded-circle" style="width: 36px; height: 36px; padding: 0; line-height: 34px;">
                <i class="bi bi-arrow-left"></i>
            </a>
            <h4 class="mb-0 fw-bold">{{ frame.name }}</h4>
        </div>
        <a href="{{ frame.url }}" target="_blank" class="btn btn-sm btn-outline-primary">
            <i class="bi bi-box-arrow-up-right me-1"></i> Buka di Tab Baru
        </a>
    </div>

    <div class="card border-0 shadow-sm rounded-4 flex-grow-1 overflow-hidden" id="iframeContainer">
        <div class="card-body p-0 d-flex flex-column">
            <iframe src="{{ frame.url }}" width="100%" height="100%" style="border:none; flex-grow: 1;" allowfullscreen id="monitorFrame"></iframe>
        </div>
    </div>
</div>


{% endblock %}
