{% extends "base.html" %}

{% block toolbar_left %}
    <a href="{{ url_for('purchasing.index') }}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i> Back to POs</a>
{% endblock %}

{% block content %}
<div class="card shadow-sm border-0 mx-auto" style="max-width: 600px;">
    <div class="card-header bg-white">
        <h4 class="mb-0">Create Purchase Order</h4>
    </div>
    <div class="card-body">
        <form action="{{ url_for('purchasing.create_po') }}" method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="mb-3">
                <label class="form-label small fw-bold text-muted">PO Number (Auto-generated if empty)</label>
                <input type="text" class="form-control" name="po_number" placeholder="e.g. PO-12345">
            </div>
            
            <div class="mb-3">
                <label class="form-label small fw-bold text-muted">Vendor *</label>
                <select class="form-select" name="vendor_id" required>
                    <option value="">-- Select Vendor --</option>
                    {% for vendor in vendors %}
                        <option value="{{ vendor.id }}">{{ vendor.name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="mb-4">
                <label class="form-label small fw-bold text-muted">Ship To Site *</label>
                <select class="form-select" name="site_id" required>
                    <option value="">-- Select Site --</option>
                    {% for site in sites %}
                        <option value="{{ site.id }}">{{ site.name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <hr>
            <div class="text-end">
                <a href="{{ url_for('purchasing.index') }}" class="btn btn-light me-2">Cancel</a>
                <button type="submit" class="btn btn-primary px-4"><i class="bi bi-cart"></i> Create PO</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
