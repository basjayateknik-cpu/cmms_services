{% extends "base.html" %}

{% block toolbar_left %}
    <a href="{{ url_for('settings.index') }}#parts" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i> Back</a>
{% endblock %}

{% block head %}
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<style>
/* Select2 Bootstrap 5 Theme overrides */
.select2-container .select2-selection--single {
    height: 38px;
    border: 1px solid #ced4da;
    border-radius: 0.375rem;
}
.select2-container--default .select2-selection--single .select2-selection__rendered {
    line-height: 36px;
    padding-left: 12px;
}
.select2-container--default .select2-selection--single .select2-selection__arrow {
    height: 36px;
}
</style>
{% endblock %}

{% block content %}
<div class="card shadow-sm border-0 mx-auto" style="max-width: 800px;">
    <div class="card-header bg-white">
        <h4 class="mb-0">{% if part %}Edit Part: {{ part.code }}{% else %}New Part{% endif %}</h4>
    </div>
    <div class="card-body">
        <form method="POST" action="">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <label class="form-label text-muted small fw-bold">Part Name *</label>
                    <input type="text" class="form-control" name="name" value="{{ part.name if part else '' }}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label text-muted small fw-bold">Product Code *</label>
                    <input type="text" class="form-control" name="code" value="{{ part.code if part else '' }}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label text-muted small fw-bold">Category</label>
                    <select class="form-select select2-tags" name="category_name">
                        <option value=""></option>
                        {% for cat in categories %}
                            <option value="{{ cat.name }}" {% if part and part.category and part.category.name == cat.name %}selected{% endif %}>{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label text-muted small fw-bold">Unit</label>
                    <input type="text" class="form-control" name="unit" list="unitList" value="{{ part.unit if part and part.unit else '' }}" placeholder="e.g. pcs, kaleng">
                    <datalist id="unitList">
                        <option value="pcs">
                        <option value="kaleng">
                        <option value="box">
                        <option value="set">
                        <option value="unit">
                    </datalist>
                </div>
            </div>
            
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <label class="form-label text-muted small fw-bold">Currency</label>
                    <select name="currency" class="form-select">
                        <option value="IDR" {% if part and part.currency == 'IDR' %}selected{% endif %}>IDR (Rupiah)</option>
                        <option value="USD" {% if part and part.currency == 'USD' %}selected{% endif %}>USD (Dollar)</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label text-muted small fw-bold">Price</label>
                    <input type="number" step="0.01" class="form-control" name="price" value="{{ part.price if part else '0.00' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label text-muted small fw-bold">Cost</label>
                    <input type="number" step="0.01" class="form-control" name="unit_cost" value="{{ part.unit_cost if part else '0.00' }}">
                </div>
            </div>
            
            <hr>
            <div class="text-end">
                <a href="{{ url_for('settings.index') }}#parts" class="btn btn-light me-2">Cancel</a>
                <button type="submit" class="btn btn-primary px-4"><i class="bi bi-save"></i> Save</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script>
$(document).ready(function() {
    $('.select2-tags').select2({
        tags: true,
        placeholder: "-- Select or type new category --",
        allowClear: true,
        width: '100%'
    });
});
</script>
{% endblock %}
