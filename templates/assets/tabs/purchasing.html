<div class="row">
    <div class="col-md-5">
        <h5 class="fw-bold text-primary mb-4 border-bottom pb-2">Valuation</h5>
        <div class="card shadow-sm border-0 bg-light">
            <div class="card-body">
                <h6 class="text-muted text-uppercase mb-2">Estimated Replacement Value</h6>
                <h2 class="fw-bold text-success mb-3">${{ "%.2f"|format(asset.replacement_value|float) }}</h2>
                <button class="btn btn-sm btn-outline-secondary w-100" data-bs-toggle="modal" data-bs-target="#updateValueModal"><i class="bi bi-currency-dollar"></i> Update Value</button>
            </div>
        </div>
        
        <!-- Modal Update Value -->
        <div class="modal fade" id="updateValueModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-sm">
                <div class="modal-content">
                    <form action="{{ url_for('assets.update_replacement_value', asset_id=asset.id) }}" method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                        <div class="modal-header">
                            <h5 class="modal-title">Update Valuation</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <label class="form-label">Replacement Value</label>
                            <input type="number" step="0.01" name="replacement_value" class="form-control" value="{{ asset.replacement_value }}" required>
                        </div>
                        <div class="modal-footer">
                            <button type="submit" class="btn btn-success w-100">Save</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <div class="col-md-7">
        <h5 class="fw-bold text-primary mb-4 border-bottom pb-2">Purchase Receipts & History</h5>
        <p class="text-muted small">Purchase Orders tracking this asset or containing components for this asset.</p>
        
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <!-- Using placeholder for now since Purchase Orders are mostly linked via parts or direct project assignment -->
                <thead class="table-light">
                    <tr>
                        <th>PO #</th>
                        <th>Vendor</th>
                        <th>Date</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="4" class="text-center text-muted py-4 fst-italic">Purchasing integration is module-dependent.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
